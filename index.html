<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Image → Color ASCII Converter — Best CSS & JS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1724;
    --card:#0b1220;
    --muted:#94a3b8;
    --accent:#7c3aed;
    --glass: rgba(255,255,255,0.04);
    --mono: "Courier New", Courier, monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:linear-gradient(180deg,var(--bg), #071025 120%);
    color:#e6eef8;
    font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    padding:24px;
  }

  .wrap{
    max-width:1200px;
    margin:0 auto;
    display:grid;
    grid-template-columns: 420px 1fr;
    gap:20px;
    align-items:start;
  }

  .card{
    background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
    border-radius:12px;
    padding:16px;
    box-shadow: 0 6px 24px rgba(2,6,23,0.6);
    border:1px solid rgba(255,255,255,0.03);
  }

  .controls h2{
    margin:0 0 10px 0;
    font-size:18px;
  }
  .section{
    margin-bottom:12px;
  }

  label{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-bottom:6px;
  }

  input[type="file"]{
    display:block;
  }

  .row{
    display:flex;
    gap:8px;
  }
  .btn{
    background:var(--accent);
    color:white;
    padding:8px 12px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    font-weight:600;
    box-shadow:0 6px 18px rgba(124,58,237,0.14);
  }
  .btn.secondary{
    background:transparent;
    border:1px solid rgba(255,255,255,0.06);
    color:var(--muted);
    box-shadow:none;
  }

  input[type="range"]{
    width:100%;
  }
  select,input[type="number"],input[type="text"]{
    width:100%;
    padding:8px 10px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.04);
    background:var(--glass);
    color:inherit;
  }

  .preview{
    display:grid;
    gap:12px;
  }

  .imageWrap{
    background: linear-gradient(135deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border-radius:10px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.02);
    padding:8px;
  }

  .original{
    width:100%;
    height: auto;
    display:block;
    max-height:360px;
    object-fit:contain;
    border-radius:6px;
    background:#020617;
  }

  .asciiContainer{
    width:100%;
    overflow:auto;
    background: #010411;
    border-radius:8px;
    padding:10px;
    min-height:320px;
  }

  pre.ascii{
    font-family: var(--mono);
    white-space: pre;
    line-height:1;
    margin:0;
    letter-spacing:0;
    font-size:8px;
    color: #fff;
  }

  .toolbar{
    display:flex;
    gap:8px;
    margin-top:8px;
    align-items:center;
  }

  .info{
    margin-top:6px;
    font-size:13px;
    color:var(--muted);
  }

  footer{
    margin-top:18px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
  }

  /* Responsive */
  @media (max-width:980px){
    .wrap{grid-template-columns: 1fr; padding-bottom:12px}
    .original{max-height:240px}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card controls">
      <h2>Image → Color ASCII (Client-side)</h2>

      <div class="section">
        <label for="file">Upload image (or paste URL below)</label>
        <input id="file" type="file" accept="image/*">
      </div>

      <div class="section">
        <label for="imgUrl">Or paste image URL</label>
        <div class="row">
          <input id="imgUrl" type="text" placeholder="https://example.com/photo.jpg">
          <button id="loadUrl" class="btn secondary">Load URL</button>
        </div>
      </div>

      <div class="section">
        <label>Columns (controls ASCII detail)</label>
        <input id="cols" type="range" min="30" max="300" value="120">
        <div class="row" style="margin-top:6px">
          <input id="colsNumber" type="number" min="30" max="300" value="120">
          <div style="flex:1"></div>
          <label style="margin:0;font-size:13px;color:var(--muted)">Font size</label>
          <input id="fontSize" type="range" min="6" max="18" value="8" style="width:140px">
        </div>
      </div>

      <div class="section">
        <label>Options</label>
        <div class="row">
          <select id="charset">
            <option value="@%#*+=-:. " selected>Dark → Light (dense)</option>
            <option value="$@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrjft/\|()1{}[]?-_+~<>i!lI;:,^`'. ">Full grayscale ramp</option>
            <option value=" .:-=+*#%@">Simple (light to dark)</option>
          </select>
          <button id="invertBtn" class="btn secondary">Invert</button>
        </div>
      </div>

      <div class="section">
        <label>Color Mode</label>
        <div class="row">
          <button id="colorOn" class="btn">Color</button>
          <button id="colorOff" class="btn secondary">Mono</button>
          <div style="flex:1"></div>
          <button id="downloadTxt" class="btn secondary">Download .txt</button>
          <button id="downloadPng" class="btn">Save PNG</button>
        </div>
      </div>

      <div class="info">
        Tip: Use higher columns for more detail. Increase font size for readability. Color mode samples pixel color and paints ASCII chars.
      </div>
    </div>

    <div class="card preview">
      <div class="imageWrap">
        <img id="originalImage" class="original" alt="Original image preview">
      </div>

      <div class="toolbar">
        <div style="display:flex;gap:8px;align-items:center;">
          <button id="convert" class="btn">Convert to ASCII</button>
          <button id="toggleFull" class="btn secondary">Toggle Full Image</button>
        </div>
        <div style="flex:1"></div>
        <div style="color:var(--muted)">Status: <span id="status">Idle</span></div>
      </div>

      <div class="asciiContainer" id="asciiContainer">
        <pre id="ascii" class="ascii" aria-live="polite"></pre>
      </div>

      <canvas id="hiddenCanvas" style="display:none"></canvas>
    </div>
  </div>

<script>
/*
  Client-side Image to ASCII converter
  - Uses a hidden canvas to sample pixels
  - Maps brightness → char from selected charset
  - If color mode ON, wraps characters with inline <span style="color:rgb(...)">
  - Downloads: .txt (ASCII) and PNG (rendered to canvas)
*/

const fileInput = document.getElementById('file');
const loadUrlBtn = document.getElementById('loadUrl');
const imgUrlInput = document.getElementById('imgUrl');
const originalImage = document.getElementById('originalImage');
const convertBtn = document.getElementById('convert');
const asciiEl = document.getElementById('ascii');
const colsRange = document.getElementById('cols');
const colsNumber = document.getElementById('colsNumber');
const fontSizeRange = document.getElementById('fontSize');
const charsetSelect = document.getElementById('charset');
const invertBtn = document.getElementById('invertBtn');
const colorOnBtn = document.getElementById('colorOn');
const colorOffBtn = document.getElementById('colorOff');
const downloadTxtBtn = document.getElementById('downloadTxt');
const downloadPngBtn = document.getElementById('downloadPng');
const hiddenCanvas = document.getElementById('hiddenCanvas');
const statusEl = document.getElementById('status');
const asciiContainer = document.getElementById('asciiContainer');
const toggleFull = document.getElementById('toggleFull');

let useColor = true;
let inverted = false;
let lastAsciiText = '';
let charRamp = charsetSelect.value;

colsRange.addEventListener('input', () => {
  colsNumber.value = colsRange.value;
});
colsNumber.addEventListener('change', () => {
  let v = parseInt(colsNumber.value) || 100;
  v = Math.max(30, Math.min(300, v));
  colsRange.value = v;
  colsNumber.value = v;
});

fontSizeRange.addEventListener('input', () => {
  const size = fontSizeRange.value + 'px';
  asciiEl.style.fontSize = size;
});

charsetSelect.addEventListener('change', () => charRamp = charsetSelect.value);
invertBtn.addEventListener('click', () => { inverted = !inverted; invertBtn.classList.toggle('btn'); invertBtn.classList.toggle('btn',''); updateStatus(`Invert: ${inverted}`); });

colorOnBtn.addEventListener('click', () => { useColor = true; colorOnBtn.classList.add('btn'); colorOffBtn.classList.remove('btn'); updateStatus('Color: ON'); });
colorOffBtn.addEventListener('click', () => { useColor = false; colorOffBtn.classList.add('btn'); colorOnBtn.classList.remove('btn'); updateStatus('Color: OFF'); });

fileInput.addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  loadImage(url);
});

loadUrlBtn.addEventListener('click', () => {
  const url = imgUrlInput.value.trim();
  if (!url) { updateStatus('Please paste a valid image URL'); return; }
  // Slight validation
  if (!/^https?:\/\//i.test(url)) {
    updateStatus('Please include http(s):// in URL');
    return;
  }
  loadImage(url);
});

function loadImage(url){
  updateStatus('Loading image...');
  originalImage.src = url;
  originalImage.onload = () => {
    updateStatus('Image loaded');
  };
  originalImage.onerror = () => updateStatus('Failed to load image. Try a different URL or upload.');
}

convertBtn.addEventListener('click', () => {
  if(!originalImage.src) { updateStatus('No image loaded'); return; }
  convertImageToAscii();
});

toggleFull.addEventListener('click', () => {
  // Toggle between fit and full width
  if(originalImage.style.maxWidth === '100%'){
    originalImage.style.maxWidth = '';
    originalImage.style.maxHeight = '';
  } else {
    originalImage.style.maxWidth = '100%';
    originalImage.style.maxHeight = '600px';
  }
});

// ASCII conversion core
function convertImageToAscii(){
  updateStatus('Converting...');
  setTimeout(() => {
    try {
      const cols = parseInt(colsRange.value, 10) || 120;
      const fontHeight = parseInt(fontSizeRange.value, 10) || 8;

      const img = originalImage;
      const canvas = hiddenCanvas;
      const ctx = canvas.getContext('2d');

      // Determine dimensions based on desired columns
      const imgW = img.naturalWidth || img.width;
      const imgH = img.naturalHeight || img.height;
      const aspectRatio = imgH / imgW;

      // Character aspect ratio correction (characters are taller)
      // Adjusted factor (0.55 to get good visual results)
      const charWidth = 1;
      const charHeight = 1.8; // tweak to fit vertical spacing
      const colsCount = cols;
      const cellW = Math.max(1, Math.floor(imgW / colsCount));
      const colsReal = Math.floor(imgW / cellW);
      const rows = Math.floor((imgH / cellW) / (charHeight));

      // Canvas size for sampling
      canvas.width = colsReal;
      canvas.height = rows;

      // Draw scaled image to canvas
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      // Read pixel data
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;

      // Build ASCII
      const ramp = charRamp;
      const rampLen = ramp.length;
      const lines = [];
      const spans = []; // used only when color ON

      for(let y=0; y<canvas.height; y++){
        let line = '';
        for(let x=0; x<canvas.width; x++){
          const idx = (y * canvas.width + x) * 4;
          const r = data[idx], g = data[idx+1], b = data[idx+2], a = data[idx+3];
          // compute brightness / luminance
          const lum = (0.2126*r + 0.7152*g + 0.0722*b) / 255;
          let t = lum;
          if(inverted) t = 1 - t;
          // map to char
          const charIndex = Math.min(rampLen-1, Math.floor((1 - t) * rampLen));
          let ch = ramp[charIndex] || ' ';
          // Replace spaces with a small visible char if mono and very dark, but keep as is for color
          if(!useColor && ch === ' ') ch = ' ';
          if(useColor){
            // We'll build spans for color output
            const color = `rgb(${r},${g},${b})`;
            // Use zero-width space hack? No; we'll insert span-wrapped char
            line += `<span style="color:${color}">${escapeHtml(ch)}</span>`;
          } else {
            line += escapeHtml(ch);
          }
        }
        lines.push(line);
      }

      const asciiHtml = lines.join('\n');
      if(useColor){
        asciiEl.innerHTML = asciiHtml;
      } else {
        // When mono, ensure text-only
        asciiEl.textContent = lines.join('\n');
      }

      // Style font-size
      asciiEl.style.fontSize = fontHeight + 'px';
      asciiEl.style.lineHeight = '1';
      lastAsciiText = lines.map(l => stripHtml(l)).join('\n');

      updateStatus('Done — ASCII ready');
    } catch(err){
      console.error(err);
      updateStatus('Error during conversion: ' + (err.message || err));
    }
  }, 20);
}

// Helpers
function updateStatus(t){
  statusEl.textContent = t;
}

// Escape HTML for safe text output
function escapeHtml(ch){
  return ch
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

// Strip any HTML tags to get plain text (for .txt)
function stripHtml(html){
  return html.replace(/<[^>]*>/g, '');
}

// Download text
downloadTxtBtn.addEventListener('click', () => {
  if(!lastAsciiText && asciiEl.textContent.trim()===''){
    updateStatus('Nothing to download — convert first');
    return;
  }
  const text = lastAsciiText || asciiEl.textContent;
  const blob = new Blob([text], {type: 'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ascii-art.txt';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
});

// Save PNG (render ASCII to canvas)
downloadPngBtn.addEventListener('click', async () => {
  // Determine render size based on displayed font-size and ASCII columns/rows
  const text = useColor ? asciiEl.innerHTML : escapeHtml(asciiEl.textContent);
  if(!text || text.trim()==='') { updateStatus('Nothing to save — convert first'); return; }

  // Create an offscreen canvas sized to text metrics
  const fontSize = parseInt(fontSizeRange.value, 10) || 8;
  const lineHeight = fontSize * 1.0;
  const lines = (useColor ? stripHtml(asciiEl.innerHTML) : asciiEl.textContent).split('\n');
  const cols = Math.max(...lines.map(l => l.length));
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');

  // approximate size: width = cols * (fontSize*0.55), height = lines*lineHeight
  const charW = fontSize * 0.55;
  canvas.width = Math.ceil(cols * charW);
  canvas.height = Math.ceil(lines.length * lineHeight);

  // Background
  ctx.fillStyle = '#010411';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Render each char with color sampling from asciiEl when color mode on
  ctx.font = `${fontSize}px ${getComputedStyle(asciiEl).fontFamily}, monospace`;
  ctx.textBaseline = 'top';

  if(useColor){
    // We'll draw using the innerHTML spans: create a temp element to parse spans
    const temp = document.createElement('div');
    temp.innerHTML = asciiEl.innerHTML;
    // Replace <br> with newline if any, but our content already has newline separators.
    const spanLines = temp.innerHTML.split('\n');
    for(let row=0; row<spanLines.length; row++){
      const lineHtml = spanLines[row];
      // Create temp container to query spans in this row
      const rowWrap = document.createElement('div');
      rowWrap.innerHTML = lineHtml;
      let x = 0;
      // If there are many spans, iterate
      const kids = Array.from(rowWrap.childNodes);
      for(const node of kids){
        if(node.nodeType === Node.TEXT_NODE){
          // text node: draw as default color
          const txt = node.textContent || '';
          for(const ch of txt){
            ctx.fillStyle = '#fff';
            ctx.fillText(ch, x, row * lineHeight);
            x += charW;
          }
        } else if(node.nodeType === Node.ELEMENT_NODE){
          const txt = node.textContent || '';
          const color = node.style.color || '#fff';
          ctx.fillStyle = color;
          for(const ch of txt){
            ctx.fillText(ch, x, row * lineHeight);
            x += charW;
          }
        }
      }
    }
  } else {
    ctx.fillStyle = '#e6eef8';
    for(let i=0;i<lines.length;i++){
      ctx.fillText(lines[i], 0, i*lineHeight);
    }
  }

  // Open download
  canvas.toBlob(function(blob){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ascii-art.png';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 3000);
  }, 'image/png');
});

// Utility: set a nice demo if no input after load
window.addEventListener('load', () => {
  // If user didn't upload anything, show a default sample image via dataURL? We'll use a lightweight placeholder
  originalImage.src = "https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=1600&q=80&auto=format&fit=crop";
  updateStatus('Sample image loaded — replace by upload or URL');
});
</script>
</body>
</html>
